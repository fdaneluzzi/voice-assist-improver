configuration:
  anthropic_api_key:
    name: Chave de API da Anthropic
    description: Crie no Console da Anthropic, de preferência dentro de um workspace próprio com limite de gasto baixo.
  anthropic_workspace_id:
    name: ID do workspace da Anthropic
    description: Só é necessário se a sua chave não estiver ligada a um workspace.
  language:
    name: Idioma
    description: Idioma do prompt de voz embutido, das mensagens faladas e do painel.
  model:
    name: Modelo de voz
    description: Qualquer ID de modelo que sua chave de API possa usar (por exemplo claude-haiku-5-5). Responde aos pedidos que o Assist não entendeu; modelos menores são mais baratos e rápidos. O painel avisa se o ID não estiver disponível.
  analysis_model:
    name: Modelo da análise
    description: Qualquer ID de modelo que sua chave de API possa usar. Usado uma vez por dia para sugerir melhorias; um modelo mais capaz dá sugestões melhores.
  monthly_budget_usd:
    name: Teto de gasto mensal (USD)
    description: Quando o gasto estimado chega nele, o serviço de IA deixa de ser chamado. 0 desliga o teto.
  web_search:
    name: Busca na web
    description: Permite que o modelo pesquise na web. Desligada por padrão.
  voice_tool_denylist:
    name: Ferramentas bloqueadas
    description: Ferramentas de voz que nunca devem ser oferecidas ao modelo. Aceita padrões como light__*.
  retention_days:
    name: Dias para guardar os pedidos
    description: O que as pessoas dizem fica guardado localmente. Pedidos mais antigos que isso são apagados. A análise só precisa de cerca de uma semana.
  analysis_hour:
    name: Hora da análise diária
    description: Hora local (0-23) da análise diária. -1 desliga o agendamento.
  suggestion_domains:
    name: Domínios que as sugestões podem tocar
    description: Apelidos, automações e cenas só são sugeridos para entidades destes domínios. Fechaduras e alarmes ficam de fora por padrão; inclua lock ou alarm_control_panel só se quiser sugestões para eles.
  blocked_device_classes:
    name: Classes de dispositivo bloqueadas
    description: Entidades com estas classes nunca entram numa sugestão, mesmo que o domínio seja permitido (portas de garagem, portões e portas, por padrão).
  voice_token:
    name: Token do Home Assistant para voz (avançado)
    description: Opcional. Token de longa duração de um usuário sem administrador, para as ferramentas de voz rodarem com menos privilégios que o acesso próprio do app. Deixe de fora, a menos que queira isso.
