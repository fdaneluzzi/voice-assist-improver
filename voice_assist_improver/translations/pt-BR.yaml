configuration:
  anthropic_api_key:
    name: Chave de API da Anthropic
    description: Crie no Console da Anthropic, de preferência dentro de um workspace próprio com limite de gasto baixo.
  anthropic_workspace_id:
    name: ID do workspace da Anthropic
    description: Só é necessário se a sua chave não estiver ligada a um workspace.
  language:
    name: Idioma
    description: Idioma do prompt de voz embutido, das mensagens faladas e do painel.
  model:
    name: Modelo de voz
    description: Responde aos pedidos que o Assist não entendeu. Haiku é o mais barato; Sonnet é mais cuidadoso.
  analysis_model:
    name: Modelo da análise
    description: Usado uma vez por dia para sugerir melhorias.
  monthly_budget_usd:
    name: Teto de gasto mensal (USD)
    description: Quando o gasto estimado chega nele, o serviço de IA deixa de ser chamado. 0 desliga o teto.
  web_search:
    name: Busca na web
    description: Permite que o modelo pesquise na web. Desligada por padrão.
  voice_tool_denylist:
    name: Ferramentas bloqueadas
    description: Ferramentas de voz que nunca devem ser oferecidas ao modelo. Aceita padrões como light__*.
  retention_days:
    name: Dias para guardar os pedidos
    description: Pedidos gravados mais antigos são apagados.
  analysis_hour:
    name: Hora da análise diária
    description: Hora local (0-23) da análise diária. -1 desliga o agendamento.
  voice_token:
    name: Token do Home Assistant para voz (opcional)
    description: Token de longa duração de um usuário sem privilégio de administrador. Se vazio, o app usa o acesso próprio.
