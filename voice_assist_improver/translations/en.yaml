configuration:
  anthropic_api_key:
    name: Anthropic API key
    description: Create it in the Anthropic Console, preferably inside its own workspace with a low spend limit.
  anthropic_workspace_id:
    name: Anthropic workspace ID
    description: Only needed if your API key is not tied to a workspace.
  language:
    name: Language
    description: Language of the built-in voice prompt, spoken messages and the panel.
  model:
    name: Voice model
    description: Any model ID your API key can use (for example claude-haiku-5-5). It answers the requests Assist could not handle; smaller models are cheaper and faster. The panel warns if the ID is not available.
  analysis_model:
    name: Analysis model
    description: Any model ID your API key can use. Used once a day to suggest improvements; a more capable model gives better suggestions.
  monthly_budget_usd:
    name: Monthly spending cap (USD)
    description: When the estimated spend reaches it, the AI service stops being called. 0 disables the cap.
  web_search:
    name: Web search
    description: Lets the model search the web. Off by default.
  voice_tool_denylist:
    name: Blocked tools
    description: Voice tools that must never be offered to the model. Patterns like light__* are allowed.
  retention_days:
    name: Days to keep requests
    description: What people say is stored locally. Requests older than this are deleted. The analysis only needs about a week.
  analysis_hour:
    name: Daily analysis hour
    description: Local hour (0-23) of the daily analysis. -1 turns the schedule off.
  suggestion_domains:
    name: Domains suggestions may touch
    description: Aliases, automations and scenes are only suggested for entities in these domains. Locks and alarms are left out by default; add lock or alarm_control_panel only if you want suggestions for them.
  blocked_device_classes:
    name: Blocked device classes
    description: Entities with these device classes are never part of a suggestion, even if their domain is allowed (garage doors, gates and doors by default).
  voice_token:
    name: Home Assistant token for voice (advanced)
    description: Optional. A long-lived token of a non-admin user, so voice tools run with fewer privileges than the app's own access. Leave it out unless you want that.
